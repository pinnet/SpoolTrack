version: '3.8'

services:
  spooltrack-dev:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: spooltrack-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./data:/app/data
      # Named volume for node_modules to avoid overwriting
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_PATH=/app/data/spooltrack.db
      - LOG_LEVEL=debug
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - spooltrack-network

networks:
  spooltrack-network:
    driver: bridge

volumes:
  node_modules:
